# Case data schema: evals/case-schema.json (v1.2)
schema_version: "1.2"
ui_types:
  - id: dashboard
    name: 数据仪表盘
    description: 数据概览、分析与监控界面
    archived: false
  - id: commerce
    name: 电商
    description: 商品、购物与交易流程
    archived: false
  - id: content
    name: 内容 / 媒体
    description: 文章、资讯、媒体浏览界面
    archived: false
  - id: saas-admin
    name: SaaS 工作台
    description: 管理型应用与业务控制台
    archived: false
  - id: landing-page
    name: 营销 / 落地页
    description: 品牌展示、推广与转化页面
    archived: false
  - id: portfolio
    name: 作品集
    description: 个人或团队作品展示
    archived: false
  - id: other
    name: 其他
    description: 暂无法归入其他页面类型
    archived: false
  - id: interactive-experience
    name: 互动体验 / 3D 演示
    description: 沉浸式场景、WebGL / Canvas 演示或可操控的 3D 页面
    archived: false
  - id: developer-resource
    name: 开发者资源 / 文档站
    description: 技术库主页、文档、示例与开发工具入口
    archived: false
task_types:
  - id: restore
    name: 页面还原
    description: 依据界面参考生成可运行页面
    archived: false
  - id: transfer
    name: 风格迁移
    description: 保留目标内容和功能并迁移视觉风格
    archived: false
  - id: design-system
    name: 设计系统提取
    description: 提取可复用的视觉规范与设计资产
    archived: false
  - id: requirements
    name: 需求反推
    description: 从成品界面推断需求与功能
    archived: false
  - id: multi-mode
    name: 多模式组合
    description: 一个任务组合多个逆向工作流
    archived: false
