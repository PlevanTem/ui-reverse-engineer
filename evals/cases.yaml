  - id: UIR-0003
    title: 28K Studio — 创意工作室主页
    ui_type_id: portfolio
    task_type_id: restore
    description: 斯堪的纳维亚数字设计工作室主页，以黑底、超大 28K 字样和动态纹理构成首屏；页面包含 Work / Studio 导航、服务、关于、奖项、原则和联系区块，并显示日期、天数与城市时钟。
    keywords:
      - 创意工作室
      - 黑白极简
      - 超大字体
      - 动态滚动
      - Canvas
      - 工作室介绍
    url: https://28k.studio/
    technology_stack:
      - Nuxt
      - Vue.js
      - Storyblok
      - HTML Video
    technology_stack_source: url_analysis
    technology_stack_evidence:
      - "[当前页面运行时，2026-10-15] 规范域名 https://www.28k.studio/ 的首页与 /work 均加载 /_nuxt/ 模块，页面包含 #__nuxt 根节点及 window.__NUXT__ 配置。"
      - "[当前页面运行时，2026-10-15] Nuxt payload/config 含 Storyblok 数据键，页面 Open Graph 图片来自 a.storyblok.com；Nuxt 属于 Vue 框架。"
      - "[当前页面运行时，2026-10-15] 首页和 /work 使用原生 video 元素播放 Vimeo progressive_redirect 媒体；两页均未发现 Canvas 元素。"
      - "[当前页面资源，2026-10-15] 首页预加载 PPNeueMontreal-Medium.woff2 与 PPNeueMontreal-Regular.woff2；字体作为视觉证据，不作为技术栈标签。"
      - "[历史第三方陈述] 开发者 Aristide Benoist 对 2023 年新 28K 网站的图片转场使用 #webgl、#vanillaWebgl、#javascript、#shader；该证据只支持旧版本，不能归入当前页面技术栈。"
      - "[限制] 当前站点已改版，Claude Code 提供的预加载文案、原生 WebGL/GLSL 与旧路由 HTML 证据对应 2023 年上线版本；本次未发现可把这些历史技术归因到现站的运行时证据。"
    difficulty: hard
    input_kinds:
      - url
    status: draft
    notes: 2026-10-15 复核发现 URL 已从 2023 年版本改版为 Nuxt/Storyblok 页面；现站首页与 /work 使用 HTML Video，未发现 Canvas。现有标题、描述和关键词仍带有旧版视觉记录，正式评测前必须重新冻结当前首屏、滚动关键帧、路由状态和响应式断点；若要评测 2023 版，需另存可授权的历史 fixture，不能只依赖当前 URL。
    created_at: "2026-10-11T16:38:14+08:00"
    updated_at: "2026-10-15T20:24:16+08:00"

