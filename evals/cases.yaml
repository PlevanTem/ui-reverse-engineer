  - id: UIR-0007
    title: General Intuition — 动态研究实验室主页
    ui_type_id: landing-page
    task_type_id: restore
    description: General Intuition 的研究实验室营销主页，以大幅自定义字体现实验室使命和 MIRA 研究为主线；页面将循环视频与 ASCII Canvas 叠合，并提供 ASCII Settings 面板，可调整 CELL SIZE、TEXT OPACITY 与 TILE OPACITY。
    keywords:
      - 研究实验室官网
      - 营销落地页
      - 非典型排版
      - 自定义字体
      - ASCII Canvas
      - 循环视频
      - 动态视觉
      - 参数控制面板
    url: https://www.generalintuition.com/
    technology_stack:
      - Webflow
      - HTML Canvas
      - HTML Video
    technology_stack_source: url_analysis
    technology_stack_evidence:
      - 页面 DOM 包含 6 个 canvas.ascii-canvas 元素，分别与 racing、mira、bee、desert、quadruped、warehouse 区域对应。
      - 页面 DOM 包含 6 个同名配对 video 元素；均为可见、静音、自动播放、循环的视频。
      - 页面 DOM 的 w-node / w-mod 类名与已加载的 Webflow CSS 资源共同支持 Webflow 页面实现的判断。
      - 页面计算样式显示标题使用 alphalyrae，正文使用 Geist Wght；字体名称保留为视觉证据，不作为技术栈标签。
    difficulty: hard
    input_kinds:
      - url
    status: draft
    notes: 2026-10-14 可访问首页已确认标题、首屏、MIRA 研究区和 ASCII Settings 控件。该 case 用于检验动态媒体、Canvas 叠层、定制字体和非典型排版的还原；尚未冻结目标截图、视口、滚动关键帧、设置面板数值和媒体素材，不能直接作为可复现评测输入。
    created_at: "2026-10-14T22:00:00+08:00"
    updated_at: "2026-10-14T22:00:00+08:00"
