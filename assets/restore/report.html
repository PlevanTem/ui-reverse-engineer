<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restore v0.2 · 交付审批</title><style>
:root{color-scheme:light dark;--bg:#f5f7fa;--surface:#fff;--text:#17243c;--muted:#5a6881;--line:#dbe2ed;--accent:#2459b8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,sans-serif}main{max-width:1360px;margin:auto;padding:32px}h1{font-size:32px;margin:6px 0}h2{font-size:21px}header>p:first-child{letter-spacing:.15em;color:var(--accent);font-weight:700}.demo-banner{padding:12px 16px;background:#fff3cd;color:#573c00;border:1px solid #e6bb45;border-radius:8px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.summary strong,.summary small{display:block}strong{font-size:20px}small{color:var(--muted)}section,details{background:var(--surface);padding:24px;margin:18px 0;border:1px solid var(--line);border-radius:12px}summary{font-weight:650;cursor:pointer}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}th{color:var(--muted)}.scroll{overflow:auto}.evidence-columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}figure{margin:16px 0}figcaption{font-size:12px;color:var(--muted);overflow-wrap:anywhere}img,video{width:100%;height:auto;border:1px solid var(--line)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}code{overflow-wrap:anywhere}a{color:var(--accent)}form{max-width:700px;display:grid;gap:12px}label{display:block}input:not([type=checkbox]),select,textarea{display:block;width:100%;font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px}button{padding:10px 20px;color:white;background:var(--accent);border:0;border-radius:6px;font:inherit;cursor:pointer}output{color:var(--muted)}@media(prefers-color-scheme:dark){:root{--bg:#101725;--surface:#182338;--text:#edf2ff;--muted:#aab9d2;--line:#334159;--accent:#84adff}.demo-banner{background:#514015;color:#fff5cc;border-color:#947722}button{color:#101725}}@media(max-width:760px){main{padding:16px}.summary{grid-template-columns:1fr 1fr}.evidence-columns{grid-template-columns:1fr}section,details{padding:16px}}@media print{form{display:none}details{display:block}}
</style></head><body><main>{{BODY}}</main><script>
const context={{CONTEXT}};
document.getElementById('approval').addEventListener('submit',e=>{e.preventDefault();const values=Object.fromEntries(new FormData(e.target));values.manual_reviewed=e.target.elements.manual_reviewed.checked;const message=document.getElementById('message');if(values.decision!=='no_go'&&context.provisional&&!values.manual_reviewed){message.textContent='未校准结果需要人工复核。';return;}if(values.decision==='conditional_go'&&!values.conditions.trim()){message.textContent='填写后续条件。';return;}const url=URL.createObjectURL(new Blob([JSON.stringify({...context,...values},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='approval.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message.textContent='审批记录已导出，请导入归档。';});
</script></body></html>
