<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Restore v0.2 · 交付报告</title>
  <style>
    :root{color-scheme:light dark;--page:#f3f6fb;--surface:#fff;--surface-soft:#f6f8fc;--text:#18243a;--muted:#62718a;--line:#dce3ee;--accent:#2459b8;--accent-soft:#eaf1ff;--good:#13795b;--warn:#9a6700;--bad:#b42318;--shadow:0 14px 38px rgba(22,38,67,.07)}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:76px}body{margin:0;background:var(--page);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}
    .topbar{position:sticky;top:0;z-index:10;height:54px;background:#17243a;color:#f5f8ff;box-shadow:0 2px 10px rgba(0,0,0,.12)}.topbar-inner{max-width:1600px;height:100%;margin:auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:13px;font-weight:750;letter-spacing:.12em}.brand small{display:block;color:#aebbd0;font-size:11px;font-weight:500;letter-spacing:0}.print-button{border:1px solid #65738a;border-radius:8px;background:transparent;color:inherit;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
    .shell{max-width:1600px;margin:auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;padding:28px}.side-nav{position:sticky;top:78px;align-self:start;padding:12px 0;border-right:1px solid var(--line)}.nav-label{padding:0 14px 10px;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.08em}.side-nav a{display:block;padding:7px 14px;border-left:2px solid transparent;color:var(--muted);font-size:13px}.side-nav a:hover{border-left-color:var(--accent);background:var(--accent-soft);text-decoration:none;color:var(--accent)}main{min-width:0}.hero{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:18px;margin-bottom:18px}.hero-main,.hero-status,.panel,.metric{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.hero-main{padding:28px 30px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.hero h1{margin:6px 0 8px;font-size:clamp(26px,3vw,36px);line-height:1.2}.subtitle{margin:0;color:var(--muted);font-size:15px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}.chip{display:inline-flex;align-items:center;padding:4px 9px;border:1px solid var(--line);border-radius:99px;background:var(--surface-soft);color:var(--muted);font-size:11px;overflow-wrap:anywhere}.hero-status{display:flex;flex-direction:column;justify-content:space-between;padding:22px}.status-title{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.08em}.status-value{margin:5px 0;font-size:22px;font-weight:800}.status-note{color:var(--muted);font-size:12px}.status-pill{display:inline-block;margin-top:12px;padding:5px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700}
    .metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 18px}.metric{padding:16px 18px}.metric-label{color:var(--muted);font-size:11px;font-weight:700}.metric-value{margin-top:2px;font-size:23px;font-weight:800;line-height:1.25}.metric-detail{margin-top:3px;color:var(--muted);font-size:11px}
    .panel{margin:16px 0;padding:22px 24px;scroll-margin-top:70px}.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}.panel h2{margin:0;font-size:20px}.panel-head span{color:var(--muted);font-size:12px}.subhead{margin:20px 0 8px;font-size:14px}.notice{padding:11px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:13px}.notice.warning{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}.demo-banner{margin:0 0 14px;padding:11px 14px;border:1px solid #d8a62e;border-radius:9px;background:#fff3cd;color:#573c00;font-weight:700}.kv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}.kv{min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface-soft)}.kv-key{color:var(--muted);font-size:11px}.kv-value{margin-top:2px;font-size:13px;overflow-wrap:anywhere}
    .scroll{overflow:auto;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere}th{background:var(--surface-soft);color:var(--muted);font-size:11px;font-weight:750;white-space:nowrap}tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--surface-soft);color:var(--muted);font-size:11px;font-weight:700;white-space:nowrap}.badge.pass,.badge.go{background:#e8f6ef;color:var(--good)}.badge.fail,.badge.no_go{background:#fff0ef;color:var(--bad)}.badge.pending,.badge.incomplete,.badge.conditional_go{background:#fff5db;color:var(--warn)}.empty{padding:18px;border:1px dashed var(--line);border-radius:9px;color:var(--muted);text-align:center}
    .process-list{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:12px}.process-card{padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--surface-soft)}.process-card strong{display:block;font-size:12px}.process-card a{display:inline-block;margin-top:5px;font-size:11px}.process-card span{display:block;color:var(--muted);font-size:10px}
    details{border:1px solid var(--line);border-radius:9px;background:var(--surface);margin:12px 0;scroll-margin-top:70px}details>summary{padding:12px 14px;cursor:pointer;font-weight:750;font-size:13px}details[open]>summary{border-bottom:1px solid var(--line)}.details-body{padding:14px}.comparison-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}.comparison-grid{display:grid;align-items:stretch}.compare-head,.compare-state,.compare-cell{padding:12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.compare-head{position:sticky;top:0;z-index:1;background:var(--surface-soft);font-size:12px;font-weight:800}.compare-state{background:var(--surface-soft);font-size:12px;min-width:180px}.compare-state strong,.compare-state span{display:block}.compare-state span{color:var(--muted);font-size:10px}.compare-cell{min-width:240px;vertical-align:top}.compare-cell .evidence-figure{margin:0 0 12px}.compare-cell .evidence-figure:last-child{margin-bottom:0}.compare-cell img{max-height:320px}.version-badge{display:block;margin-top:3px;color:var(--good);font-size:10px}.evidence-secondary{margin-top:14px}.evidence-secondary .details-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.evidence-figure{margin:10px 0}.evidence-figure figcaption{margin-bottom:5px;color:var(--muted);font-size:11px}.evidence-figure img,.evidence-figure video{display:block;width:100%;height:auto;max-height:440px;object-fit:contain;border:1px solid var(--line);border-radius:7px;background:var(--surface-soft)}.evidence-figure a{font-size:12px}.timeline{display:grid;gap:10px}.timeline-item{padding:13px 15px;border:1px solid var(--line);border-radius:9px;background:var(--surface-soft)}.timeline-title{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;font-weight:750}.timeline-item p{margin:6px 0 0;color:var(--muted);font-size:12px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid label{font-size:12px;font-weight:650}.form-grid .full{grid-column:1/-1}input:not([type=checkbox]),select,textarea{display:block;width:100%;margin-top:4px;padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface-soft);color:var(--text);font:inherit}textarea{min-height:76px}button.primary{padding:9px 15px;border:0;border-radius:7px;background:var(--accent);color:white;font:inherit;font-weight:700;cursor:pointer}.form-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}output{color:var(--muted);font-size:12px}.footer{padding:14px 0 28px;color:var(--muted);font-size:11px;text-align:center}pre{max-height:540px;overflow:auto;padding:12px;border-radius:8px;background:var(--surface-soft);font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere}
    .footer{overflow-wrap:anywhere}
    @media(prefers-color-scheme:dark){:root{--page:#101725;--surface:#182338;--surface-soft:#1d2a40;--text:#edf2ff;--muted:#aab9d2;--line:#334159;--accent:#84adff;--accent-soft:#203453;--good:#80d6b2;--warn:#f3c969;--bad:#ff9b91;--shadow:0 14px 38px rgba(0,0,0,.14)}.demo-banner{background:#514015;color:#fff5cc;border-color:#947722}.badge.pass,.badge.go{background:#173b32}.badge.fail,.badge.no_go{background:#482624}.badge.pending,.badge.incomplete,.badge.conditional_go{background:#47391c}}
    @media(max-width:980px){.shell{grid-template-columns:1fr;padding:18px}.side-nav{position:static;display:flex;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px;background:var(--surface);white-space:nowrap}.nav-label{display:none}.side-nav a{border-left:0;border-bottom:2px solid transparent;padding:8px 10px}.side-nav a:hover{border-bottom-color:var(--accent)}.hero{grid-template-columns:minmax(0,1fr) 190px}}
    @media(max-width:680px){.topbar-inner{padding:0 14px}.shell{padding:12px}.hero{grid-template-columns:1fr}.hero-main{padding:21px}.hero-status{min-height:110px}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{padding:12px}.metric-value{font-size:19px}.panel{padding:16px;margin:12px 0}.panel-head{display:block}.panel-head span{display:block;margin-top:4px}.kv-grid,.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.process-list{grid-template-columns:repeat(2,minmax(0,1fr))}.process-card:last-child{grid-column:1/-1}.evidence-secondary .details-body{grid-template-columns:1fr}}
    @media print{body{background:#fff;color:#111}.topbar{position:static;background:#fff;color:#111;box-shadow:none;border-bottom:1px solid #aaa}.shell{display:block;max-width:none;padding:10px}.side-nav,.print-button,form{display:none!important}.hero-main,.hero-status,.metric,.panel,details{box-shadow:none;break-inside:avoid;background:#fff;color:#111}.panel{padding:14px;margin:10px 0}details:not([open])>.details-body{display:block}a{color:#111;text-decoration:none}.scroll{overflow:visible}table{font-size:10px}}
  </style>
</head>
<body>
  <div class="topbar"><div class="topbar-inner"><div class="brand">UI REVERSE ENGINEER<small>Restore · run review</small></div><button class="print-button" type="button" onclick="window.print()">打印 / 保存 PDF</button></div></div>
  <div class="shell">
    <nav class="side-nav" aria-label="报告目录">
      <div class="nav-label">报告目录</div>
      <a href="#overview">审阅摘要</a><a href="#task">任务与交付</a><a href="#quality">最终质量</a><a href="#process">运行过程</a><a href="#evidence">证据与残差</a><a href="#accounting">时间与用量</a><a href="#approval">审批</a>
    </nav>
    <main id="report-content">{{BODY}}</main>
  </div>
  <script>
    const context={{CONTEXT}};
    document.getElementById('approval-form')?.addEventListener('submit',e=>{e.preventDefault();const values=Object.fromEntries(new FormData(e.target));values.manual_reviewed=e.target.elements.manual_reviewed.checked;const message=document.getElementById('message');if(values.decision!=='no_go'&&context.provisional&&!values.manual_reviewed){message.textContent='评分器未校准，需要人工复核。';return;}if(values.decision==='conditional_go'&&!values.conditions.trim()){message.textContent='请填写后续条件。';return;}const url=URL.createObjectURL(new Blob([JSON.stringify({...context,...values},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='approval.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message.textContent='审批 JSON 已导出，请用 Restore 命令归档。';});
  </script>
</body>
</html>
