<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --bg: #f6f8fb; --panel: #fff; --panel-soft: #f7f9fc; --line: #d7dfeb;
      --text: #162033; --muted: #61738f; --accent: #2563eb; --accent-soft: #e8f0ff;
      --success: #0f9f6e; --warning: #b7791f; --danger: #dc2626;
      --radius: 16px; --shadow: 0 14px 36px rgba(15,23,42,.06);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: var(--font); color: var(--text); background: linear-gradient(180deg,#eef3fb 0,#f6f8fb 220px); line-height: 1.55; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .cv-topbar { background: #14223b; color: #f9fbff; border-bottom: 1px solid #243b5f; }
    .cv-topbar-inner { max-width: 1480px; min-height: 58px; margin: auto; padding: 12px 30px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .cv-brand { font-size: 13px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
    .cv-brand small { display: block; margin-top: 2px; font-size: 11px; font-weight: 500; letter-spacing: .02em; color: #a9b9d1; text-transform: none; }
    .top-actions { display: flex; gap: 10px; }
    .quiet-button { padding: 8px 12px; border: 1px solid #667995; background: transparent; color: #f9fbff; border-radius: 9px; font-size: 12px; }
    .quiet-button:hover { background: #263b5d; }
    .layout { display: grid; grid-template-columns: 220px minmax(0,1fr); gap: 30px; max-width: 1480px; margin: auto; padding: 34px 30px 80px; }
    .side-nav { position: sticky; top: 22px; align-self: start; border-left: 2px solid var(--line); padding: 10px 0 10px 18px; }
    .side-nav .nav-caption { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 15px; }
    .side-nav a { display: block; padding: 7px 0; color: #425574; font-size: 13px; }
    .side-nav a:hover { color: var(--accent); }
    .main { min-width: 0; }
    .hero { display: grid; grid-template-columns: minmax(0,1fr) 260px; gap: 22px; margin-bottom: 24px; }
    .hero-main, .hero-status, .panel, .metric-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .hero-main { padding: 30px 32px; position: relative; overflow: hidden; }
    .hero-main::after { content: ""; position: absolute; right: -50px; top: -80px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle,#e3edff 0,transparent 72%); pointer-events: none; }
    .eyebrow { color: var(--accent); text-transform: uppercase; letter-spacing: .11em; font-weight: 800; font-size: 11px; }
    h1 { font-size: clamp(26px,3vw,38px); line-height: 1.15; margin: 11px 0 13px; letter-spacing: -.025em; }
    h2 { font-size: 20px; margin: 0; letter-spacing: -.015em; }
    h3 { font-size: 15px; margin: 0 0 8px; }
    p { margin: 0 0 10px; }
    .subtitle, .muted { color: var(--muted); }
    .hero-status { padding: 27px 25px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
    .hero-status .status-large { font-size: 23px; line-height: 1.2; font-weight: 800; }
    .hero-status .micro { font-size: 12px; color: var(--muted); }
    .meta-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
    .chip, .badge { display: inline-block; border-radius: 999px; padding: 5px 10px; font-size: 11px; font-weight: 750; white-space: nowrap; }
    .chip { color: #4e607a; background: #f3f6fa; border: 1px solid #e1e6ef; }
    .badge { background: var(--accent-soft); color: #1d4ed8; }
    .badge.pass, .badge.keep, .badge.go { background: #def8eb; color: #087453; }
    .badge.fail, .badge.revert, .badge.no_go { background: #ffebeb; color: #b42328; }
    .badge.unknown, .badge.inconclusive, .badge.conditional_go { background: #fff1d9; color: #946200; }
    .badge.pending, .badge.unmeasured, .badge.baseline { background: #e9eef7; color: #4b5f7b; }
    .badge.critical { background: #ffebeb; color: #b42328; }
    .badge.major { background: #fff1d9; color: #946200; }
    .badge.minor { background: #e9eef7; color: #4b5f7b; }
    .panel { padding: 25px 28px; margin-bottom: 20px; scroll-margin-top: 22px; }
    .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 18px; margin-bottom: 18px; padding-bottom: 13px; border-bottom: 1px solid var(--line); }
    .section-head span { color: var(--muted); font-size: 12px; }
    .metric-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 12px; margin: 0 0 20px; }
    .metric-card { padding: 18px 18px 16px; }
    .metric-card .label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .metric-card .value { font-size: 25px; font-weight: 800; line-height: 1.2; margin: 8px 0; }
    .metric-card .detail { color: var(--muted); font-size: 11px; }
    .comparison-list { display: grid; gap: 16px; }
    .comparison { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--panel-soft); }
    .comparison-title { display: flex; justify-content: space-between; gap: 14px; font-size: 13px; margin-bottom: 10px; }
    .comparison-title span, .comparison .micro { color: var(--muted); font-size: 11px; }
    .comparison-images { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; }
    .comparison figure { margin: 0; min-width: 0; }
    .comparison figcaption { color: var(--muted); font-size: 11px; margin-bottom: 5px; }
    .comparison img { display: block; width: 100%; max-height: 260px; object-fit: contain; object-position: top center; background: #111; border: 1px solid var(--line); }
    .kv-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px 22px; }
    .kv { min-width: 0; border-bottom: 1px solid #e9edf4; padding: 0 0 10px; }
    .kv .key { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
    .kv .val { overflow-wrap: anywhere; font-size: 13px; font-weight: 650; }
    .subsection { margin-top: 24px; }
    .subsection:first-child { margin-top: 0; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; }
    th { background: #f2f5fa; color: #536784; font-size: 11px; font-weight: 800; white-space: nowrap; }
    th, td { padding: 11px 13px; border-bottom: 1px solid #e7ecf4; vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    td { overflow-wrap: anywhere; }
    .empty { padding: 16px; border-radius: 10px; background: var(--panel-soft); color: var(--muted); font-size: 12px; }
    .note { padding: 14px 16px; border-left: 3px solid var(--accent); background: #f0f5ff; border-radius: 0 9px 9px 0; font-size: 12px; }
    .note.warning { border-color: #d49821; background: #fff8ea; }
    .note.danger { border-color: #dc2626; background: #fff1f1; }
    .timeline { position: relative; padding-left: 19px; border-left: 2px solid #dce5f4; }
    .timeline-item { position: relative; padding: 1px 0 20px 18px; }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-item::before { content: ""; position: absolute; left: -26px; top: 5px; width: 11px; height: 11px; border-radius: 50%; background: #9bb6e4; border: 2px solid #fff; box-shadow: 0 0 0 1px #bdcde6; }
    .timeline-title { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; font-weight: 800; font-size: 13px; margin-bottom: 6px; }
    .timeline-item p { color: #455875; font-size: 12px; margin-bottom: 5px; }
    .timeline-item .tiny { color: var(--muted); font-size: 11px; }
    .approval-form { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 15px; margin-top: 20px; }
    .approval-form label { display: block; font-size: 12px; font-weight: 750; }
    .approval-form label.full { grid-column: 1 / -1; }
    .approval-form input, .approval-form select, .approval-form textarea { display: block; width: 100%; margin-top: 6px; border: 1px solid #cdd8e8; border-radius: 9px; padding: 10px 11px; color: var(--text); background: #fff; }
    .approval-form textarea { resize: vertical; min-height: 80px; }
    .approval-form .manual-review { display: flex; align-items: start; gap: 8px; font-weight: 600; }
    .approval-form .manual-review input { width: auto; margin: 3px 0 0; }
    .approval-actions { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .primary-button { color: white; background: var(--accent); border: 1px solid var(--accent); border-radius: 9px; padding: 10px 16px; font-weight: 750; }
    .primary-button:hover { background: #1d4ed8; }
    .approval-message { font-size: 12px; color: var(--muted); }
    .hash { font: 11px ui-monospace, Consolas, monospace; overflow-wrap: anywhere; color: #58708f; }
    .demo-banner { border: 1px solid #f0d08b; background: #fff6df; color: #775000; border-radius: 11px; padding: 11px 14px; font-size: 12px; font-weight: 700; margin-bottom: 20px; }
    .footer { padding: 12px 0 0; color: var(--muted); font-size: 11px; }
    @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } .side-nav { display: flex; position: static; gap: 12px; flex-wrap: wrap; border-left: 0; border-bottom: 1px solid var(--line); padding: 0 0 12px; } .side-nav .nav-caption { display: none; } .side-nav a { padding: 2px 0; } }
    @media (max-width: 760px) { .layout { padding: 18px 14px 50px; gap: 18px; } .cv-topbar-inner { padding: 12px 15px; } .hero { grid-template-columns: 1fr; } .hero-main, .hero-status, .panel { padding: 20px; } .metric-grid { grid-template-columns: repeat(2,minmax(0,1fr)); } .kv-grid, .approval-form, .comparison-images { grid-template-columns: 1fr; } }
    @media (max-width: 460px) { .metric-grid { grid-template-columns: 1fr; } .top-actions { display: none; } }
    @media print {
      body { background: #fff; color: #162033; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .cv-topbar, .side-nav, .approval-form, .no-print { display: none !important; }
      .layout { display: block; max-width: none; padding: 0; }
      .hero-main, .hero-status, .panel, .metric-card { box-shadow: none; }
      .hero { grid-template-columns: 1fr 210px; }
      .panel, .metric-card, .timeline-item, tr { break-inside: avoid; }
      .table-wrap { overflow: visible; }
      a { color: inherit; }
      .footer { margin-top: 16px; }
    }
  </style>
</head>
<body>
  <header class="cv-topbar"><div class="cv-topbar-inner"><div class="cv-brand">UI Reverse Engineer<small>Restore loop · review packet</small></div><div class="top-actions"><button class="quiet-button" type="button" onclick="window.print()">打印 / 保存 PDF</button></div></div></header>
  {{BODY}}
  <script id="report-context" type="application/json">{{CONTEXT_JSON}}</script>
  <script>
    (() => {
      const node = document.getElementById('report-context');
      if (!node) return;
      const context = JSON.parse(node.textContent);
      const form = document.getElementById('approval-form');
      if (!form) return;
      const message = document.getElementById('approval-message');
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const decision = form.elements.decision.value;
        const reviewer = form.elements.reviewer.value.trim();
        const rationale = form.elements.rationale.value.trim();
        const conditions = form.elements.conditions.value.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
        const manualReviewed = form.elements.manual_reviewed.checked;
        if (!reviewer || !rationale) { message.textContent = '请填写审阅者和理由。'; return; }
        if (decision === 'conditional_go' && conditions.length === 0) { message.textContent = '有条件 Go 必须写明条件。'; return; }
        if ((decision === 'go' || decision === 'conditional_go') && !context.eligible_for_positive_decision) { message.textContent = '当前红线或指标尚不完整，不能批准 Go。'; return; }
        if ((decision === 'go' || decision === 'conditional_go') && !context.judge_calibrated && !manualReviewed) { message.textContent = '未校准评委的正向审批须先确认人工视觉复核。'; return; }
        const record = {
          schema_version: 'restore-loop-approval/v0.1',
          record_id: 'APP-' + Date.now().toString(36).toUpperCase(),
          run_id: context.run_id,
          case_id: context.case_id,
          report_sha256: context.report_sha256,
          template_sha256: context.template_sha256,
          decision, reviewer, decided_at: new Date().toISOString(), rationale, conditions, manual_reviewed: manualReviewed
        };
        const blob = new Blob([JSON.stringify(record, null, 2) + '\n'], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `${context.run_id}-${context.case_id}-approval.json`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        message.textContent = '审批记录已导出。归档后可重新生成带决定的报告。';
      });
    })();
  </script>
</body>
</html>
