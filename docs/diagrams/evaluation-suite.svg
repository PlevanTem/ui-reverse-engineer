<style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#17283f}.title{font-size:28px;font-weight:700}.group{font-size:16px;font-weight:650;fill:#5d708c}.name{font-size:22px;font-weight:650}.sub{font-size:16px;fill:#536985}.tag{font-size:14px;font-weight:650}.wire{fill:none;stroke:#8493ab;stroke-width:2;marker-end:url(#arrow)}.join{fill:none;stroke:#b2bed0;stroke-width:2}.current rect{fill:#eff6ff;stroke:#82ade6}.proposed rect{fill:#fff7eb;stroke:#e4a345;stroke-dasharray:7 5}.mixed rect{fill:#f5f1fc;stroke:#ae94d7}.node rect{stroke-width:1.6;rx:14}.small{font-size:15px;fill:#5d708c}.legend{font-size:14px;fill:#536985}</style>
