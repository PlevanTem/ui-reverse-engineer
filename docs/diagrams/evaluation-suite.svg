<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1100" role="img" aria-labelledby="title desc">
<title id="title">开发内嵌评估套件：目标系统架构</title><desc id="desc">宿主适配器、证据快照与评估协调器连接工程、开发效果、轨迹与独立验收四条通道，结果进入 Langfuse，并按权限返回开发反馈或发布审阅。颜色区分已有、待新增和待接自动路由。</desc>
